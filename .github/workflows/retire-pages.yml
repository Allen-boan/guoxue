name: 将旧阅读入口迁回 GitHub

on:
  push:
    branches: [main]
    paths: [.github/workflows/retire-pages.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: 替换旧网站内容
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          directory = Path(os.environ['RUNNER_TEMP']) / 'guide-redirect'
          directory.mkdir()
          document = '''<!doctype html>
          <html lang="zh-CN"><meta charset="utf-8">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0;url=https://github.com/Allen-boan/guoxue#readme">
          <title>“过的人”行动指南</title>
          <p>这本指南已迁回 GitHub。</p>
          <p><a href="https://github.com/Allen-boan/guoxue#readme">打开全书目录</a></p>
          </html>'''
          for name in ['index.html', '404.html']:
              (directory / name).write_text(document)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/guide-redirect
      - uses: actions/deploy-pages@v4
      - name: 确认旧网站页面和资源已撤下
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          import time
          base = 'https://allen-boan.github.io/guoxue/'
          target = 'https://github.com/Allen-boan/guoxue#readme'
          def read(path):
              request = Request(base + path, headers={'Cache-Control': 'no-cache'})
              try:
                  with urlopen(request, timeout=20) as response:
                      return response.status, response.read().decode('utf-8')
              except HTTPError as error:
                  return error.code, error.read().decode('utf-8')
          for attempt in range(12):
              status, body = read('')
              if status == 200 and target in body and '精神总部' not in body:
                  break
              time.sleep(5)
          else:
              raise SystemExit('旧首页尚未被替换')
          paths = ['start/', 'charter/', 'principles/', 'practice/',
                   'practice/water', 'practice/sleep', 'practice/lean-muscle',
                   'practice/housing', 'practice/secondhand', 'practice/renting',
                   'new/', 'decisions/', 'identity/', 'dictionary/',
                   'counterexamples/', 'about/', 'maintenance',
                   'assets/style.DZI7yu-J.css', 'assets/app.CKu_pzRB.js']
          for path in paths:
              status, body = read(path)
              if status != 404:
                  raise SystemExit(f'旧地址仍可访问：{path} ({status})')
          print('旧网站已替换：17 个正文地址、2 个资源地址已返回 404；旧首页仅跳转 GitHub。')
          PY
