- id: health-first
  name: 健康不能拿来省
  category: health
  source_type: guoxue_practice
  summary: 预算可以调整，基本营养、合理睡眠、必要医疗和安全不能当作省钱的筹码。
  status: accepted
  cost_dimensions:
  - money
  - time
  - energy
  - health_risk
  - safety_risk
  quality_dimensions:
  - health
  - sleep
  - nutrition
  - safety
  - stability
  - sustainability
  core_principles:
  - P01
  benefits:
  - 优先守住健康、睡眠、营养、安全和长期稳定；这些不是要用优惠抵消的项目。
  risks:
  - 把一般生活习惯当作诊疗替代。
  - 在必要支出与可用资源紧张时，无法单靠个人调整解决问题。
  boundaries:
  - 这不是诊断、用药或治疗指南；明显健康问题不能靠网络口号处理。
  - 不拿“将来肯定省医疗费”保证任何产品或行为的回报，也不把受限制的人归咎为不自律。
  applicable_when:
  - 做生活预算、挑商品或决定是否继续透支时，都应先检查这一条。
  not_applicable_when:
  - 已有诊疗安排、特殊营养需求或特殊身体情况，不按普通生活建议替换专业方案。
  recommendation: 先检查最近有没有长期吃不够、睡不够，或影响生活的明显不适。 把基本食物、休息和必要医疗排在低价值消费前；需要时寻求适合自己情况的专业帮助。 资源紧张时先争取可用的支持与低门槛服务，逐步改善，不拿困难给自己打道德分。
  review_status: editorial_reviewed
  doc_path: docs/03-日常行动/08-健康与运动.md
  anchor: health-first
  cost_changes:
    reduced:
    - 健康与安全风险：避免因长期透支、危险用品或拖延必要处理而增加风险。
    - 精力：减少反复硬撑和围绕身体问题的折腾。
    increased:
    - 金钱与时间：合理饮食、休息、必要医疗和合格用品本来就需要投入。
  quality_effects:
    maintained:
