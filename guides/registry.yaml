- id: housing-useful-space
  name: 空间利用率
  category: housing
  source_type: guoxue_practice
  summary: 面积是数字，好不好住是每天的事。
  status: accepted
  cost_dimensions:
  - money
  - space
  - maintenance
  - time
  - safety_risk
  quality_dimensions:
  - comfort
  - convenience
  - safety
  - stability
  core_principles:
  - P01
  benefits:
  - 减少闲置空间的租金、无用家具和清洁维护负担。
  - 维护舒适、便利、安全和稳定的生活安排，不以拥挤证明节约。
  risks:
  - 重新规划布局、处理闲置和合适的收纳需要时间，也可能有必要支出。
  boundaries:
