- id: housing-rental-total
  name: 租万物 · 租房：看完整住房成本
  category: housing
  source_type: internet_theory
  summary: 房租省下来了，日子不能全赔在路上。
  status: conditional
  cost_dimensions:
  - money
  - time
  - energy
  - space
  - maintenance
  - safety_risk
  quality_dimensions:
  - safety
  - sleep
  - comfort
  - time_autonomy
  - stability
  core_principles:
  - P01
  benefits:
  - 减少用不到的地址、面积和装修溢价，避免后续交通和搬迁的隐性支出。
  - 保住居住安全、舒适、睡眠与稳定，尽量留出属于自己的时间。
  risks:
  - 合适的房源可能租金更高；实地看房、试走通勤和核验合同也要花时间。
  boundaries:
  - 月租少500元、每天多两小时通勤只是一个假设例子，不能自动判定划算；危险房源和基本居住质量不达标直接排除。
  applicable_when:
  - 选择租房、续租或搬家，需要比较真实居住体验时。
  not_applicable_when:
  - 无障碍、照护、夜间通勤、居家工作等有特殊需求时，不能套统一房型与距离。
  recommendation: 列不能退让的条件，再把月租、交通、水电、服务费、押金占用与搬家放在同一份比较中。 核验出租权限，读清维修、涨租、押金与解约规则，保存合同、交接和付款记录。
  review_status: source_pending
