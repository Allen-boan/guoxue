    - convenience
    - time_autonomy
    - sustainability
  effect_note: 预期方向与判断目标，不保证个体收益；实际采用前核查条件和风险。
- id: effective-transport
  name: 最短有效交通
  category: transport
  source_type: guoxue_practice
  summary: 选真正顺手、安全、总负担小的走法，不选一个看起来有身份的走法。
  status: accepted
  cost_dimensions:
  - money
  - time
  - energy
  - maintenance
  - space
  - decision
  - safety_risk
  quality_dimensions:
  - safety
  - comfort
  - convenience
  - time_autonomy
  core_principles:
  - P01
  benefits:
  - 守住交通安全，改善便利、舒适和时间自主。
  risks:
  - 只看最快路线，忽略天气、身体条件和交通安全。
  - 购车或购置装备后产生未计入的维护与停放负担。
  boundaries:
  - 遵守交通规则，必要头盔和防护不省；不以赶时间为理由冒险。
  - “最短有效”看完整行程与个人条件，不只看地图公里数或最快纪录。
  applicable_when:
  - 有不同出行方式可比较，或某条常用路线长期让你费劲。
  not_applicable_when:
  - 行动不便、带孩子、夜间出行、恶劣天气和携带重物时，不能照搬别人的低价路线。
  recommendation: 列出两三种可行方式，比较门到门时间、费用、换乘、天气和自己能承受的体力。 用常见场景试一次：工作日、买菜、雨天各需要什么；不必一种交通方式包办所有事情。 留下常用路线和一个可靠备选，交通条件变了再更新。
  review_status: editorial_reviewed
