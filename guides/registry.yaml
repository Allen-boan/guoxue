guides:
- id: food-basics
  name: 基础饮食优先
  category: food
  source_type: guoxue_practice
  summary: 先解决营养，再解决仪式感。
  status: accepted
  cost_dimensions:
  - money
  - decision
  - time
  - health_risk
  - safety_risk
  quality_dimensions:
  - nutrition
  - health
  - safety
  - convenience
  - stability
  core_principles:
  - P01
  benefits:
  - 减少不需要的健康食品溢价、临时选餐和反复补救的开销。
  - 先保住营养、饮食安全与稳定，再考虑口味和便利。
  risks:
  - 准备食物、看标签可能多花一些时间；营养够用也需要必要预算。
  boundaries:
  - 不靠少吃、长期单一饮食或来源不明食物压低成本；具体营养和诊疗需要结合可靠专业建议。
  applicable_when:
  - 日常饮食不稳定，或希望把餐费放在真正有用的地方时。
  not_applicable_when:
  - 有食物过敏、疾病相关饮食要求、孕期或其他特殊需要时，不能直接套普通搭配。
  recommendation: 检查自己常吃的几顿饭：是否有主食、蛋白质食物、蔬菜水果，以及安全的水；找最容易补上的缺口。 先把基本饮食安排稳定，再决定昂贵食品是否带来明确价值；不把保健品当成正常吃饭的替代。
  review_status: editorial_reviewed
  doc_path: docs/03-日常行动/01-饮食.md
  anchor: food-basics
  cost_changes:
    reduced:
    - 减少不需要的健康食品溢价、临时选餐和反复补救的开销。
    increased:
    - 准备食物、看标签可能多花一些时间；营养够用也需要必要预算。
  quality_effects:
    maintained:
    - 先保住营养、饮食安全与稳定，再考虑口味和便利。
    improved: []
- id: food-daily-and-experience
  name: 日常饭与体验饭分开
  category: food
  source_type: guoxue_practice
  summary: 日常饭负责可靠，好吃的一顿负责好好享受。
  status: accepted
  cost_dimensions:
  - money
  - decision
  - energy
  - time
  quality_dimensions:
  - nutrition
  - convenience
  - experience
  - relationships
  - stability
  core_principles:
  - P01
  benefits:
  - 减少每天找店、安排复杂菜式和为展示付费的金钱、决策与精力消耗。
  - 日常饭保住营养、便利和稳定，体验饭照顾真实快乐与重要关系。
  risks:
  - 留出体验饭预算，提前安排一次聚餐，也需要钱和时间。
  boundaries:
  - 不能为了攒一顿大餐长期吃不够，也不把体验饭变成报复性进食或攀比。
  applicable_when:
  - 普通日子选餐费劲，又希望保留美食和聚餐体验时。
  not_applicable_when:
  - 饮食限制、工作班次或照护安排复杂时，先保住可获得的合适食物。
  recommendation: 给普通工作日留几个可靠选项：吃得舒服、方便取得、总价可接受。 吃完看看实际感受。真正喜欢可以再去，只为拍照而疲惫就换方式。
  review_status: editorial_reviewed
  doc_path: docs/03-日常行动/01-饮食.md
  anchor: food-daily-and-experience
  cost_changes:
    reduced:
    - 减少每天找店、安排复杂菜式和为展示付费的金钱、决策与精力消耗。
    increased:
    - 留出体验饭预算，提前安排一次聚餐，也需要钱和时间。
  quality_effects:
    maintained:
    - 日常饭保住营养、便利和稳定，体验饭照顾真实快乐与重要关系。
    improved:
    - 真实饮食体验与重要关系
- id: food-less-packaging
  name: 少为包装买单
  category: food
  source_type: guoxue_practice
  summary: 吃进去的价值，比包装上写出来的价值更重要。
  status: accepted
  cost_dimensions:
  - money
  - attention
  - time
  - safety_risk
  quality_dimensions:
  - nutrition
  - safety
  - convenience
  - experience
  core_principles:
  - P01
  benefits:
  - 减少没有实际用处的包装与标签溢价，以及追新品的注意力消耗。
  - 在营养、卫生、口味和便利能满足需要的前提下，维持真实饮食体验。
  risks:
  - 最初比较成分、规格和储存条件会花时间，不能为省一点钱无限研究。
  boundaries:
  - 不为省包装钱接受过期、破损、信息不清或储存不当的食品；喜欢设计也可以量力购买。
  applicable_when:
  - 同类食品有多种包装和定位，且能看清必要信息时。
  not_applicable_when:
  - 需要特殊配方、便携分装，或无法保证散装卫生与追溯时。
  recommendation: 先确定自己要吃什么、能吃多少，比较同类食品的可食用量和实际价格。 买正常用量，吃过再判断。大包装若吃不完或储存不便，也未必划算。
  review_status: editorial_reviewed
  doc_path: docs/03-日常行动/01-饮食.md
  anchor: food-less-packaging
  cost_changes:
    reduced:
    - 减少没有实际用处的包装与标签溢价，以及追新品的注意力消耗。
    increased:
    - 最初比较成分、规格和储存条件会花时间，不能为省一点钱无限研究。
  quality_effects:
    maintained:
    - 在营养、卫生、口味和便利能满足需要的前提下，维持真实饮食体验。
    improved: []
- id: food-water
  name: 大水理论：把日常饮水安排顺手
  category: food
  source_type: internet_theory
  summary: 水源安全、方便取得、容器好洗，比喝水挑战重要。
  status: observation
  cost_dimensions:
  - money
  - time
  - decision
  - maintenance
  - energy
  - safety_risk
  quality_dimensions:
  - safety
  - convenience
  - health
  core_principles:
  - P01
  benefits:
  - 可能减少日常买饮料的钱、临时购买时间和选择负担。
  - 维持安全、方便的日常饮水；减少含糖饮料应以自己的实际饮食变化判断。
  risks:
  - 清洗容器、携带和确认水源也要花时间；大瓶太重就会增加负担。
  boundaries:
  - 不强迫大量饮水，不喝来源不明的水，不用喝水替代饮食和治疗。完整主张见原理论条目，本节是本书的行动分析。
  applicable_when:
  - 日常饮水不方便，或想减少临时购买饮料时。
  not_applicable_when:
  - 医嘱限制饮水、特殊健康情况或高温高强度活动，不能照抄普通日常安排。
  recommendation: 选一个经常缺水的场景，先用已有且材质适合、好清洗的容器。 试几天看是否更方便；太重、漏水或难洗，就换小杯或可靠补水点。
  review_status: source_pending
  doc_path: docs/03-日常行动/01-饮食.md
  anchor: food-water
  cost_changes:
    reduced:
    - 可能减少日常买饮料的钱、临时购买时间和选择负担。
    increased:
    - 清洗容器、携带和确认水源也要花时间；大瓶太重就会增加负担。
  quality_effects:
    maintained:
    - 维持安全、方便的日常饮水；减少含糖饮料应以自己的实际饮食变化判断。
    improved: []
  theory_id: water
- id: sleep-adequate
  name: 长睡眠理论：保障合理睡眠
  category: sleep
  source_type: internet_theory
  summary: 先有合适的睡眠机会，再谈白天能不能撑住。
  status: observation
  cost_dimensions:
  - energy
  - time
  - money
  - health_risk
  quality_dimensions:
  - sleep
  - health
  - emotional_wellbeing
  - sustainability
  core_principles:
  - P01
  benefits:
  - 减少可避免的精力消耗、无效熬夜，以及不必要的补救产品支出。
  - 优先维护睡眠与健康，观察恢复感和白天功能是否改善，不承诺人人有同样效果。
  risks:
  - 睡眠需要真实时间，可能要调整晚间娱乐、工作协调和照护分工。
  boundaries:
  - 不是越睡越好，不自行用酒精或药物追时长；明显或持续睡眠问题应寻求专业评估。完整主张见原理论条目。
  applicable_when:
  - 可避免的熬夜挤占休息，且能够调整一部分安排时。
  not_applicable_when:
  - 轮班、育儿、照护时先争取可行支持；持续失眠、明显嗜睡或睡很久仍异常疲惫，不能靠继续加时解决。
  recommendation: 观察几天睡觉、起床与白天状态，找出最常挤占睡眠的可改变因素。 看自己白天的感受和生活功能，而不是只追手环分数或卧床时长。
  review_status: source_pending
  doc_path: docs/03-日常行动/02-睡眠.md
  anchor: sleep-adequate
  cost_changes:
    reduced:
    - 减少可避免的精力消耗、无效熬夜，以及不必要的补救产品支出。
    increased:
    - 睡眠需要真实时间，可能要调整晚间娱乐、工作协调和照护分工。
  quality_effects:
    maintained:
    - 优先维护睡眠与健康，观察恢复感和白天功能是否改善，不承诺人人有同样效果。
    improved:
    - 恢复感与白天状态（需结合实际观察）
  theory_id: sleep
- id: sleep-environment
  name: 睡眠环境优先
  category: sleep
  source_type: guoxue_practice
  summary: 每天都要用的舒适，值得排到前面。
  status: accepted
  cost_dimensions:
  - money
  - energy
  - maintenance
  - time
  - safety_risk
  quality_dimensions:
  - sleep
  - comfort
  - safety
  - sustainability
  core_principles:
  - P01
  benefits:
  - 减少反复试买助眠小物、处理环境问题的精力，以及用不到的装饰开销。
  - 维护舒适、安全与睡眠条件；环境改善不能保证解决所有睡眠问题。
  risks:
  - 合适的床具、遮光和环境处理可能增加前期支出与一次性调整时间。
  boundaries:
  - 不堵塞通风或逃生路径，不忽略电器和取暖安全；儿童等特殊人群睡眠环境按可靠专业要求安排。
  applicable_when:
  - 有明确、可改善的睡眠环境问题，且预算允许时。
  not_applicable_when:
  - 根源是疾病、工作安排或居住安全隐患时，买装备不能替代必要处理。
  recommendation: 先找最明显的干扰：光、噪声、温度或床具不适，只处理最关键的一项。 用一段时间观察是否更舒服。没效果就停下，不继续叠加一堆设备。
  review_status: editorial_reviewed
