    - 常用任务更容易完成，日常打扰更少
- id: guide-subscription-audit
  name: 定期盘点数字订阅
  category: digital
  source_type: guoxue_practice
  summary: 让会员和云服务按真实需要续费，而不是靠遗忘。
  status: accepted
  cost_dimensions:
  - money
  - attention
  - maintenance
  - decision
  - opportunity
  quality_dimensions:
  - convenience
  - safety
  - stability
  - sustainability
  core_principles:
  - P01
  benefits:
  - 保持重要功能、数据和账号的可访问性
  - 订阅预算更清楚，续费更加主动
  risks:
  - 取消后容量不足、资料被删、账号或工作功能中断
  - 只卸载 App 或删除支付方式，以为已经取消
  boundaries:
  - 以服务实际取消、降级和保留规则为准，不假定资料会永久保留
  - 先迁移并验证再取消，必要时保留过渡费用
  applicable_when:
  - 自动扣款项目多或用途不清
  - 多个服务功能重叠，需要重新分配预算
  not_applicable_when:
  - 资料尚未迁移核验，取消将影响访问或删除数据
  - 订阅仍是工作、照护或重要备份的必要工具
  recommendation: 检查一项不用的续费，涉及资料时完成迁移核验再取消。
  review_status: editorial_reviewed
  doc_path: docs/03-日常行动/17-数字生活.md
  anchor: guide-subscription-audit
  cost_changes:
    reduced:
    - 减少不用的续费和重复订阅
    - 减少分散管理与忘记扣款的负担
    increased:
    - 盘点和迁移资料需要时间
    - 替代服务可能需要付费或改变使用方式
  quality_effects:
    maintained:
    - 保持重要功能、数据和账号的可访问性
    improved:
    - 订阅预算更清楚，续费更加主动
- id: guide-data-backup
  name: 数据备份
  category: digital
  source_type: guoxue_practice
  summary: 重要资料需要一份真的能找回来的副本。
  status: accepted
  cost_dimensions:
  - money
  - time
  - maintenance
  - safety_risk
  quality_dimensions:
  - safety
  - stability
  - convenience
  core_principles:
  - P01
  benefits:
  - 保留重要资料的完整性与访问能力
  - 设备或账号出问题时，更容易恢复重要内容
  risks:
  - 同步误删也同步到副本、密码遗失、备份损坏或隐私泄露
  boundaries:
  - 同步不自动等于备份，要确认是否保留可恢复的历史或独立副本
  - 备份不能保证零损失；删除原件、清空设备或取消云服务前，先核验完整性与恢复能力
  applicable_when:
  - 资料重要、无法轻易重新获得
  - 资料集中在一个设备、账号或存储位置
  not_applicable_when:
  - 备份位置仍依赖同一故障点，或自己无法可靠访问
  - 把敏感资料上传到不可信服务
  recommendation: 今天先给一份不可替代的资料做独立副本，并实际试着恢复。
  review_status: editorial_reviewed
  doc_path: docs/03-日常行动/17-数字生活.md
  anchor: guide-data-backup
  cost_changes:
    reduced:
    - 降低部分因单点故障导致的资料损失风险
    - 减少丢失后重建、恢复与焦急补救的负担
    increased:
    - 独立存储、云服务或设备可能需要费用
    - 检查访问、更新副本和测试恢复需要时间
  quality_effects:
    maintained:
    - 保留重要资料的完整性与访问能力
    improved:
    - 设备或账号出问题时，更容易恢复重要内容
- id: guide-exit-cost
  name: 考虑退出成本
  category: lifecycle
  source_type: guoxue_practice
  summary: 购买前就想清楚，不再需要时怎样安全、合理地退出。
  status: accepted
  cost_dimensions:
  - money
  - time
  - energy
  - space
  - maintenance
  - safety_risk
  quality_dimensions:
  - convenience
  - safety
  - stability
  - sustainability
  core_principles:
  - P01
  benefits:
  - 守住资料、财产和合规处理的安全
  - 需求变化、故障或搬家时更容易调整
  risks:
  - 转售价不及预期、搬运与处理费用增加
  - 资料泄露或危险物品被错误转赠和处理
  boundaries:
  - 转售收益是估算，不保证成交；总账采用购入减实际转售收入时，不再重复加算同一转售损失
  - 电池、电器、药品等按当地适用规定处理，不自行拆解危险部件
  applicable_when:
  - 购买大型物品、电子设备或带持续服务的产品
  - 可能搬家、需求变化或维修困难
  not_applicable_when:
  - 因期待高价转卖而购买原本不需要的东西
  - 退出方案依赖未经核实的渠道或保证
  recommendation: 下次购买前先回答退出问题，再把它放进总成本比较。
  review_status: editorial_reviewed
  doc_path: docs/03-日常行动/18-物品生命周期.md
  anchor: guide-exit-cost
  cost_changes:
    reduced:
    - 提前识别搬运、处理、锁定服务和资料迁移负担
    - 减少不再使用的物品持续占用空间
    increased:
    - 购买前查询维修、退订与回收条件需要时间
    - 更容易退出的方案可能购入价格更高
  quality_effects:
    maintained:
    - 守住资料、财产和合规处理的安全
    improved:
    - 需求变化、故障或搬家时更容易调整
