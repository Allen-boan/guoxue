  - sustainability
  core_principles:
  - P01
  benefits:
  - 争取合理睡眠、时间自主与日常便利；交通安全和基本居住质量要先守住。
  risks:
  - 更高租金与搬家费用超出预算。
  - 忽略房屋质量或路线安全，只追求距离短。
  boundaries:
  - “月租少 500 元，却每天多通勤两小时”是判断例子，没有统一结论。
  - 不选明显不安全的房屋或交通路线，不把时间强行折成每个人都一样的金额。
  applicable_when:
  - 正在选住处、换工作地点或调整通勤路线，而且有几个真实可选的方案。
  not_applicable_when:
  - 预算很紧、需要照护家人或只有少数房源时，不能套“离公司近就一定好”；没有选择余地也不是不会过。
  recommendation: 用平常上下班的时段试走路线，记下门到门时间、换乘和容易延误的环节。 把可行房源的租金、交通费、往返时间和居住体验放在一起比；租房的完整检查见[租万物中的租房](../02-具体生活方法/租万物/01-租房.md)。
    再看自己的预算和责任，选能长期承受的方案；暂时搬不了，也可以先减少一项路上折腾。
