  doc_path: docs/03-日常行动/07-交通通勤.md
  anchor: commute-time-cost
  cost_changes:
    reduced:
    - 时间：减少可避免的长距离往返。
    - 精力与机会：少一点赶路疲劳，把可支配时间留给更重要的事。
    increased:
    - 金钱：更近的房源、合适的交通服务可能更贵；搬家也有一次性费用。
  quality_effects:
