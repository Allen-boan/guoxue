- id: housing-high-use-spaces
  name: 高频空间优先
  category: housing
  source_type: guoxue_practice
  summary: 先把天天用的地方过舒服，再考虑给谁看。
  status: accepted
  cost_dimensions:
  - money
  - time
  - energy
  - maintenance
  quality_dimensions:
  - comfort
  - convenience
  - safety
  - sleep
  core_principles:
  - P01
  benefits:
  - 减少低频装饰支出、绕路取物和反复收拾的时间与精力。
  - 让休息、做饭、清洁和工作更舒适、顺手，保住基本安全。
  risks:
  - 关键空间的灯光、设备或布局调整可能增加初期支出与施工协调。
  boundaries:
  - 不自行改动有风险的电路、燃气或结构，不挡通道；睡眠环境方法见上一领域，避免重复购买。
  applicable_when:
  - 居住空间有明确的高频不便，且可以调整时。
  not_applicable_when:
  - 合租、租赁或照护场景，应先确认权限和共同需要，不能只按自己习惯改。
  recommendation: 回想一周最常用的地方，写下一个反复出现的麻烦，例如桌面太暗或厨房操作不顺。 观察一周有没有更顺手，再处理下一处，不一次把全家改成展示间。
