- id: secondhand
  name: 二手消费
  aliases:
  - 二手消费
  - 咸鱼买东西
  - 闲鱼买东西
  category: 消费与使用
  summary: 在能核查功能、卫生和安全的品类中购买二手，用较少成本取得需要的使用价值。
  status: conditional
  compatibility: partly_compatible
  source_type: internet_theory
  sources: []
  source_note: 具体理论作者与原始来源待补充。
  core_principles:
  - P01
  benefits:
  - 减少新旧价差中的非功能成本
  - 让已有物品继续使用
  - 可按实际需求选择低成本替代
  risks:
  - 诈骗与隐瞒故障
  - 卫生与安全无法核验
  - 维修运费和售后成本
  - 因便宜囤积无用物品
  boundaries:
  - 对涉及人身安全、卫生或无法验证关键性能的物品保持谨慎。
  - 核对功能、状态、交易记录和售后条件，不因便宜跳过必要检查。
  - 使用有保护机制的交易方式，保护隐私和个人信息。
  recommendation: 从容易验货、风险可控、确有需要的物品开始，算清维修运费和维护成本。
  review_status: initial_editorial
  review_note: 按正文列明的条件收录，具体适用性因人而异。
