  source_note: 作者：邵艾伦 Alan。来源见本人视频与后续教程。
  core_principles:
  - P01
  - P04
  - P07
  - P08
  - P09
  - P10
  benefits:
  - 关注实际体能需要
  - 选择能坚持的运动方式
  - 减少不必要的体型展示压力
  risks:
  - 名称可能强化单一体型审美
  - 极端减脂或过度训练可能伤害健康
  - 不同身体基础需要不同方案
  boundaries:
  - 不设统一体脂、体重或训练强度，不鼓励饥饿减脂。
  - 保留基本营养和必要恢复，不能用疼痛或损伤证明效果。
  - 有疾病、伤痛或特殊身体情况时先寻求专业建议。
  recommendation: 从原视频理解通过训练获得反馈的思路，按个人情况核查实际收益、维护投入与健康边界，不把“过学”自己的解释当作作者原定义。
