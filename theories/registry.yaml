status_definitions:
  core: 核心纲领或基本原则；变更必须人工审核。
  accepted: 正式收录；已完成所需人工复核与来源核查。
  conditional: 有条件收录；仅在列明的边界和实践解释下纳入，条件与待核事项必须公开。
  observation: 观察中；证据、定义或适用性不足，尚未推荐收录。
  rejected: 不予收录；已记录生活品质损失、边界风险或其他拒绝理由。
  archived: 归档；保留历史，不再作为当前推荐。
compatibility_definitions:
  compatible: 符合
  partly_compatible: 部分符合
  incompatible: 不符合
  uncertain: 继续观察
status_note: 收录状态不等于相容性结论，也不等于来源已经核验。相容性必须针对明确主张和适用条件判断。
initial_review_note: 五个主项：三项有条件收录，两项观察中。租房属于租万物的子项，按其居住边界有条件收录。
