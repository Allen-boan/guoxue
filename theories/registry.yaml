  applicable_when:
  - 确有需要，物品功能、状态和重要历史能够核验。
  - 加入运费、清洁、维修与验货时间后，仍有合理优势。
  - 交易方式和售后边界清楚，自己能承担剩余风险。
  not_applicable_when:
  - 保护生命的用品存在无法核实的事故或损伤历史。
  - 卫生、关键性能或来源无法验证。
  - 没有验货能力和时间，或因低价囤积不需要的东西。
- id: renting
  name: 租万物
  aliases:
  - 租赁消费
  - 使用而不拥有
  category: 使用权与租用
  summary: 按实际需要和期限获得使用权，覆盖租房、工具、出行与活动用品、短期设备和阶段性家具；比较品质、总成本与维护负担，不一概主张租比买好。
  status: conditional
  compatibility: partly_compatible
  source_type: internet_theory
  sources: []
  source_note: 作者与原始来源待补充。
  core_principles:
  - P01
  benefits:
  - 用适合自己的方式满足居住与使用需求
  - 减少用不上的配置和展示溢价
  - 适合时减少闲置、储存和维护负担
  - 为真正重要的生活品质保留资源
  risks:
  - 累计租金超过购买成本
  - 押金与高额赔偿责任
  - 自动续费或租转购条款
  - 卫生和关键性能无法核验
  - 居住质量、房屋安全与通勤代价
  boundaries:
  - 签约前看清总费用、押金、续费、赔偿和退出条件。
  - 不承担明显无法负担的合同责任，不把租赁当作无风险分期。
  - 安全与卫生要求不能因为租来使用而降低。
  - 租房先保住安全、基本居住质量和合理通勤，不只比较月租。
  recommendation: 按具体场景、所需期限、生活品质与完整成本比较租用和购买；租房可长期高频使用，不套用低频物品的判断。
  review_status: initial_editorial
  review_note: 按正文列明的条件收录，具体适用性因人而异。
