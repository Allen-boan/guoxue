- id: renting
  name: 租万物
  aliases:
  - 租赁消费
  - 使用而不拥有
  category: 消费与使用
  summary: 对低频、短期需求考虑租赁，比较总租金、押金、赔偿、归还和购买维护成本。
  status: conditional
  compatibility: partly_compatible
  source_type: internet_term_unverified
  sources: []
  source_note: 作者与原始来源待补充。
  core_principles:
  - P03
  - P04
  - P05
  - P06
  - P07
  - P08
  benefits:
  - 满足短期或低频需求
  - 减少闲置和储存负担
  - 避免为一次使用长期持有
  risks:
  - 累计租金超过购买成本
  - 押金与高额赔偿责任
  - 自动续费或租转购条款
  - 卫生和关键性能无法核验
  boundaries:
