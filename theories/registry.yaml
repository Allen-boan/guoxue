  applicable_when:
  - 需要期限、功能与稳定程度明确，租用能可靠满足需求。
  - 完整费用、押金、交付、维修与退出责任透明且可负担。
  - 租房能够满足长期或阶段性居住需求，安全和基本品质有保障。
  not_applicable_when:
  - 累计租金与取还负担明显超过合适的购买或借用方案。
  - 费用、赔偿、出租权限、卫生或安全状态无法确认。
  - 合同责任无法负担，或把租赁当成无风险分期。
