  - id: housing
    name: 低成本租房
    aliases: [低租金居住, 低成本居住]
    category: 居住
    summary: 在安全和基本居住质量不退步的前提下，比较租金、通勤、能耗和搬迁等总成本。
    status: conditional
    compatibility: partly_compatible
    source_type: internet_term_unverified
    sources: []
    source_note: 准确出处待补充；本文讨论一般生活方法，不指定任何博主或网络版本为源头。
    core_principles: [P01, P02, P03, P06, P08, P10]
    benefits: [减少位置或装修展示溢价, 把住房选择放到总成本中比较, 为其他核心需要保留资源]
    risks: [消防和房屋安全风险, 潮湿噪声与通勤负担, 合同押金和提前退租风险]
    boundaries:
      - 不住有明显安全隐患或缺乏基本居住条件的房屋。
      - 实地核查房屋、出租资格、合同、押金和费用，不只看照片和月租。
      - 不能将健康和长期疲劳当作被省略的成本。
    recommendation: 用总账比较可行房源，安全和基本居住质量先通过。
    review_status: initial_editorial
    review_note: 初版整理，待发起人人工复核；未确认原始出处。
    page: docs/practice/housing.md
  - id: secondhand
    name: 二手 / 咸鱼买东西
    aliases: [二手消费, 咸鱼买东西, 闲鱼买东西]
    category: 消费与使用
    summary: 在能核查功能、卫生和安全的品类中购买二手，用较少成本取得需要的使用价值。
    status: conditional
    compatibility: partly_compatible
    source_type: internet_term_unverified
    sources: []
    source_note: 准确出处待补充；闲鱼是平台名称，本项目不与平台存在官方关系，也不保证任何交易。
    core_principles: [P02, P03, P06, P07, P08, P10]
    benefits: [减少新旧价差中的非功能成本, 让已有物品继续使用, 可按实际需求选择低成本替代]
    risks: [诈骗与隐瞒故障, 卫生与安全无法核验, 维修运费和售后成本, 因便宜囤积无用物品]
    boundaries:
      - 对涉及人身安全、卫生或无法验证关键性能的物品保持谨慎。
      - 核对功能、状态、交易记录和售后条件，不因便宜跳过必要检查。
      - 使用有保护机制的交易方式，保护隐私和个人信息。
    recommendation: 从容易验货、风险可控、确有需要的物品开始，算清维修运费和维护成本。
    review_status: initial_editorial
    review_note: 初版整理，待发起人人工复核；未确认原始出处。
    page: docs/practice/secondhand.md
  - id: renting
    name: 租万物
    aliases: [租赁消费, 使用而不拥有]
    category: 消费与使用
    summary: 对低频、短期需求考虑租赁，比较总租金、押金、赔偿、归还和购买维护成本。
    status: conditional
    compatibility: partly_compatible
    source_type: internet_term_unverified
    sources: []
    source_note: 准确出处待补充；租万物是讨论性名称，不意味着任何物品都适合租赁。
    core_principles: [P03, P04, P05, P06, P07, P08]
    benefits: [满足短期或低频需求, 减少闲置和储存负担, 避免为一次使用长期持有]
    risks: [累计租金超过购买成本, 押金与高额赔偿责任, 自动续费或租转购条款, 卫生和关键性能无法核验]
    boundaries:
      - 签约前看清总费用、押金、续费、赔偿和退出条件。
      - 不承担明显无法负担的合同责任，不把租赁当作无风险分期。
      - 安全与卫生要求不能因为租来使用而降低。
    recommendation: 优先评估低频短期场景；高频长期使用要重新比较购买与租赁总成本。
    review_status: initial_editorial
    review_note: 初版整理，待发起人人工复核；未确认原始出处。
    page: docs/practice/renting.md
