  - sustainability
  cost_changes:
    reduced:
    - 减少不需要的面积、地址与装修溢价，降低无效固定支出。
    - 合用的空间安排可能减少无用面积与后续维护负担。
    increased:
    - 更远的房源可能增加通勤、交通费用、疲劳与睡眠损失。
    - 押金占用、搬家、维修和不稳定租期增加现金、时间与情绪负担。
    - 明显消防、用电、燃气或基本居住隐患不能用低租金抵消。
  quality_effects:
    maintained:
    - 保住安全、基本居住舒适、合理睡眠、照护与重要关系。
    improved:
    - 合适的位置和房型可能改善通勤便利、时间自主与生活稳定性。
    - 减少无用溢价且保住品质时，可能降低长期住房负担。
  applicable_when:
  - 房源安全、出租权限和基本居住条件能够核查。
  - 总费用、通勤与家庭安排相容，租期和退出条件可接受。
  - 减少的是自己用不到的卖点，而非核心居住需要。
  not_applicable_when:
  - 存在明显安全隐患、违法隔断或不能保障基本居住权益。
  - 低租金依赖长期睡不好、过度拥挤或无法承受的通勤。
  - 房型与无障碍、照护、居家工作或稳定性需求冲突。
hierarchy_note: parent_id 为 null 的条目是主项；子项按 parent_id 归入所属主项，不与主项并列计数。主项收录不自动代表所有子场景适用。
source_type_definitions:
  internet_theory: 已有网络理论或网络实践；该分类不表示原始来源已找到或主张已通过审核。
  guoxue_practice: “过学”依据生活品质判断整理的实践方法；不声称本项目在互联网上首次提出这些做法。
dimension_note: cost_dimensions 与 quality_dimensions 只标记相关维度，不代表所有成本都下降或所有品质都提高。成本增减与品质变化见 cost_changes、quality_effects、risks
  和 boundaries；不同成本不直接相加，健康与安全底线不作价格交换。
