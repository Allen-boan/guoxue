  core_principles:
  - P01
  benefits:
  - 关注实际体能需要
  - 选择能坚持的运动方式
  - 减少不必要的体型展示压力
  risks:
  - 名称可能强化单一体型审美
  - 极端减脂或过度训练可能伤害健康
