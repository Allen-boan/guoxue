schema_version: '1.0'
version: '0.1.0'
language: zh-CN
updated_at: '2026-10-07'
constitution_version: '0.1.0'
status_definitions:
  core: 核心纲领或基本原则；变更必须人工审核。
  accepted: 正式收录；已完成所需人工复核与来源核查。
  conditional: 有条件收录；仅在列明的边界和实践解释下纳入，条件与待核事项必须公开。
  observation: 观察中；证据、定义或适用性不足，尚未推荐收录。
  rejected: 不予收录；已记录冲突原则、风险或其他拒绝理由。
  archived: 归档；保留历史，不再作为当前推荐。
compatibility_definitions:
  compatible: 符合
  partly_compatible: 部分符合
  incompatible: 不符合
  uncertain: 继续观察
status_note: 收录状态不等于相容性结论，也不等于来源已经核验。相容性必须针对明确主张和适用条件判断。
initial_review_note: 六项均为初版编辑整理，待发起人人工复核。其中四项有条件收录，大水与长睡眠因原始主张尚未查实而观察中；过学自己的实践分析不替代作者原话，也不代表认可同名说法的全部版本。
theories:
  - id: water
    name: 大水理论
    aliases: [大水]
    category: 身体与日常
    summary: 已找到关于大瓶或桶装水的网络转述，但原作者与完整主张尚未查实；页面另列过学对安全、方便饮水的分析。
    status: observation
    compatibility: uncertain
    analysis_scope: editorial_practice_only_not_original_claim
    source_type: secondary_repost_original_unverified
    sources:
      - title: 微博转述：看到一个博主提出了#大水理论#
        author: 江湖李傅相
        platform: weibo
        url: https://weibo.com/2/detail/5350653043935894
        evidence_type: secondary
        verified_scope: 原帖明确是转述未具名博主，含“论健康，大水大于一切；论实惠，大水大于一切。”；只能核实转述存在，不能确认提出者或健康主张。
      - title: 抖音观众反馈：听完 Alan 直播后改喝大水
        author: 黛茜茜（索引显示的发布账号）
        platform: douyin
        url: https://www.douyin.com/video/7693514523080861760
        evidence_type: secondary
        verified_scope: 搜索索引中的标题将大水与 Alan 直播相连，并含邵艾伦与薄肌标签；完整视频及直播原话未核验，不能认定首创者。
      - title: 抖音媒体视频：大水时代与饮水实用性
        author: 未核实
        platform: douyin
        url: https://www.douyin.com/video/7693349020558707987
        evidence_type: secondary
        verified_scope: 搜索索引中的媒体标题与平台链接；视频正文、发布账号及报道引用的提出者未能读取。
    source_note: 准确出处待补充；已查到二手转述，江湖李傅相是此微博的发布者，不据此认定为理论提出者。本轮未查实原作者，不代表没有明确出处。
    core_principles: [P01, P03, P04, P07, P08]
    benefits: [让日常饮水更方便, 减少不必要的饮品溢价, 把注意力放回基本需要]
    risks: [强迫大量饮水可能危害健康, 不同身体情况的饮水需求不同, 不应声称排毒或治疗疾病]
    boundaries:
      - 不设人人通用的饮水量，不以大量为正确标准。
      - 有相关疾病、特殊身体情况或医嘱时遵循专业建议。
      - 选择符合安全要求的饮用水，不削减必要营养。
    recommendation: 继续核查原作者与完整主张，暂不对同名理论作收录推荐；安全、方便饮水是页面另行讨论的实践分析。
    review_status: initial_editorial
    review_note: 观察中；已补国内抖音传播线索，原始主张与提出者仍未查实，原则关联与实践分析均不能代替原说法评审。
    page: docs/practice/water.md
  - id: sleep
    name: 长睡眠理论
    aliases: [长睡眠]
    category: 身体与日常
    summary: 原作者、具体时长主张与完整论证尚未查实；页面先列过学对合理睡眠的分析，不替原说法定义。
    status: observation
    compatibility: uncertain
    analysis_scope: editorial_practice_only_not_original_claim
    source_type: internet_term_unverified
    sources: []
    source_note: 准确出处待补充；本轮未查实提出者与原始内容，不代表没有明确出处。页面的合理睡眠建议是过学自己的实践分析，不能当作原理论的定义。
    core_principles: [P01, P03, P05, P06, P08, P09]
    benefits: [减少无效熬夜, 将资源投入基本休息, 降低装忙带来的消耗]
    risks: [一味延长时长不能解决所有睡眠问题, 异常嗜睡或持续失眠需要评估, 个人与家庭情况不同]
    boundaries:
      - 不给所有人规定统一时长，不承诺治疗效果。
      - 持续睡眠异常、白天明显嗜睡等情况应寻求专业评估。
      - 不以睡眠主张逃避必要照护或合理责任。
    recommendation: 继续核查提出者、原话与具体主张，暂不建议正式收录；合理睡眠的生活分析与原说法评审分别进行。
    review_status: initial_editorial
    review_note: 观察中；原始主张尚未查实，不能把过学对合理睡眠的分析当作已完成的理论评审。
    page: docs/practice/sleep.md
