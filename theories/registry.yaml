    source_note: 已定位邵艾伦 Alan 本人原视频与后续教程；不同平台发布日期不同，不据此声称全网首次提出。完整视频论证和具体效果仍需逐项核查。
    core_principles: [P01, P04, P07, P08, P09, P10]
    benefits: [关注实际体能需要, 选择能坚持的运动方式, 减少不必要的体型展示压力]
    risks: [名称可能强化单一体型审美, 极端减脂或过度训练可能伤害健康, 不同身体基础需要不同方案]
