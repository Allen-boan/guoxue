  core_principles:
  - P01
  - P02
  - P03
  - P06
  - P08
  - P10
  benefits:
  - 减少位置或装修展示溢价
  - 把住房选择放到总成本中比较
  - 为其他核心需要保留资源
  risks:
  - 消防和房屋安全风险
  - 潮湿噪声与通勤负担
  - 合同押金和提前退租风险
  boundaries:
  - 不住有明显安全隐患或缺乏基本居住条件的房屋。
  - 实地核查房屋、出租资格、合同、押金和费用，不只看照片和月租。
  - 不能将健康和长期疲劳当作被省略的成本。
  recommendation: 用总账比较可行房源，安全和基本居住质量先通过。
