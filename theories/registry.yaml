- id: water
  name: 大水理论
  aliases:
  - 大水
  category: 身体与日常
  summary: 长安二球（大水教父）提出的饮水主张；完整理论待补充，正文先讨论安全、方便的日常饮水。
  status: observation
  compatibility: uncertain
  analysis_scope: editorial_practice_only_not_original_claim
  source_type: internet_theory
  creator:
    name: 长安二球（大水教父）
    handle: '@TangSMer'
    account_url: https://x.com/TangSMer
  sources:
  - title: 大水理论作者账号
    author: 长安二球（大水教父）
    platform: x
    url: https://x.com/TangSMer
    source_role: creator_profile
  source_note: 作者：长安二球（大水教父），@TangSMer。完整原帖与主张待补充。
  core_principles:
  - P01
  benefits:
  - 让日常饮水更方便
  - 减少不必要的饮品溢价
  - 把注意力放回基本需要
  risks:
  - 强迫大量饮水可能危害健康
  - 不同身体情况的饮水需求不同
  - 不应声称排毒或治疗疾病
  boundaries:
  - 不设人人通用的饮水量，不以大量为正确标准。
  - 有相关疾病、特殊身体情况或医嘱时遵循专业建议。
  - 选择符合安全要求的饮用水，不削减必要营养。
  recommendation: 完整理论待补充；安全、方便饮水的实践分析见正文。
  review_status: initial_editorial
  review_note: 完整主张待补充。
  page: docs/02-具体生活方法/01-大水理论.md
  parent_id: null
  child_ids: []
  source_evidence_type: creator_account
  doc_path: docs/02-具体生活方法/01-大水理论.md
  cost_dimensions:
  - money
  - time
  - attention
  - maintenance
  - decision
  - health_risk
  - safety_risk
  quality_dimensions:
  - health
  - nutrition
  - safety
  - convenience
  - sustainability
  cost_changes:
    reduced:
    - 可能减少不需要的饮料支出、购买时间与选择负担。
    - 容器简单、好清洗时，可减少维护和操心。
    increased:
    - 带水、清洗和补水仍要花时间。
    - 复杂设备会增加买价、耗材、维护和关注负担。
  quality_effects:
    maintained:
    - 保住饮水安全、基本营养和日常便利；不能用水替代吃饭。
    improved:
    - 把饮水安排得更顺手，可能更容易维持。
    - 若替代了原本频繁喝的高糖饮料，可能有益于健康；不等于喝水越多越好。
  applicable_when:
  - 日常饮水不便，因补水麻烦反复购买不需要的饮料。
  - 有安全水源和适合场景、容易清洗的容器。
  not_applicable_when:
  - 有医嘱限制液体摄入或特殊健康情况，不能套用普通日常做法。
  - 水源无法确认安全，或需要通过短时间大量饮水完成挑战。
  - 高温劳动等特殊场景，需要按实际风险另作安排。
- id: sleep
  name: 长睡眠理论
  aliases:
  - 长睡眠
  category: 身体与日常
  summary: 作者与原始主张待补充；正文讨论合理睡眠的安排与边界。
  status: observation
  compatibility: uncertain
  analysis_scope: editorial_practice_only_not_original_claim
  source_type: internet_theory
  sources: []
  source_note: 作者与原始来源待补充。
  core_principles:
  - P01
  benefits:
  - 减少无效熬夜
  - 将资源投入基本休息
  - 降低装忙带来的消耗
  risks:
  - 一味延长时长不能解决所有睡眠问题
  - 异常嗜睡或持续失眠需要评估
  - 个人与家庭情况不同
  boundaries:
  - 不给所有人规定统一时长，不承诺治疗效果。
  - 持续睡眠异常、白天明显嗜睡等情况应寻求专业评估。
  - 不以睡眠主张逃避必要照护或合理责任。
  recommendation: 原始主张待补充；合理睡眠的实践分析见正文。
  review_status: initial_editorial
  review_note: 作者与原始来源待补充。
  page: docs/02-具体生活方法/02-长睡眠理论.md
  parent_id: null
  child_ids: []
  source_evidence_type: internet_term_unverified
  doc_path: docs/02-具体生活方法/02-长睡眠理论.md
  cost_dimensions:
  - money
  - time
  - energy
  - attention
  - maintenance
  - emotion
  - health_risk
  quality_dimensions:
  - health
  - sleep
  - time_autonomy
  - emotional_wellbeing
  - sustainability
  cost_changes:
    reduced:
    - 可能减少无效熬夜占用的时间、注意力和精力。
    - 不以睡得少展示努力，减少人设与睡眠焦虑带来的负担。
    increased:
    - 需要为休息留出时间并协调工作、家庭和个人安排。
    - 必要的遮光、降噪或床具可能需要合理预算；过度购买助眠设备反而增加维护。
  quality_effects:
    maintained:
    - 保障符合个人情况的睡眠机会和健康边界，保留必要责任与重要关系。
    improved:
    - 合理休息改善后，恢复感、白天精力和情绪可能改善，需观察个人实际变化。
    - 减少可避免的无效熬夜，可能使生活安排更可持续。
  applicable_when:
  - 睡眠经常被可避免的刷手机、装忙或无效安排挤占。
  - 能从作息或环境中找到一个可改变的环节。
  not_applicable_when:
  - 持续失眠、明显嗜睡、呼吸异常或睡很久仍疲惫，需要专业评估。
  - 轮班、育儿或照护让固定作息不可行，需先协调支持与现实安排。
  - 已有诊疗安排，不能自行以网上主张替代。
